<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MURAD APP STORE</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0b1020;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #151d35;
    padding: 25px;
    text-align: center;
}

header h1 {
    color: #00d4ff;
    font-size: 27px;
}

header p {
    color: #aaa;
    margin-top: 8px;
}

.search {
    text-align: center;
    padding: 25px;
}

.search input {
    width: 90%;
    max-width: 450px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 16px;
}

.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
    padding: 20px;
}

.app {
    background: #151d35;
    padding: 25px;
    border-radius: 15px;
    text-align: center;
    border: 1px solid #273451;
}

.app h2 {
    margin-bottom: 12px;
    color: #00d4ff;
}

.app p {
    color: #aaa;
    margin-bottom: 20px;
}

.download {
    display: inline-block;
    background: #00bfff;
    color: #000;
    padding: 12px 25px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 25px;
    color: #777;
}
</style>
</head>

<body>

<header>
    <h1>MURAD APP STORE</h1>
    <p>Your Favorite Apps In One Place</p>
</header>

<div class="search">
    <input type="text" id="search"
    placeholder="Search Apps..."
    onkeyup="searchApps()">
</div>

<div class="container" id="apps">

    <div class="app">
        <h2>My First App</h2>
        <p>Download your favorite application.</p>
        <a href="YOUR_DOWNLOAD_LINK"
        class="download">DOWNLOAD</a>
    </div>

    <div class="app">
        <h2>My Second App</h2>
        <p>Download your favorite application.</p>
        <a href="YOUR_DOWNLOAD_LINK"
        class="download">DOWNLOAD</a>
    </div>

</div>

<footer>
    © 2026 MURAD APP STORE
    <br><br>
    All Rights Reserved.
</footer>

<script>
function searchApps() {
    let input = document.getElementById("search").value.toLowerCase();
    let apps = document.querySelectorAll(".app");

    apps.forEach(app => {
        app.style.display =
        app.innerText.toLowerCase().includes(input)
        ? "block" : "none";
    });
}
</script>

</body>
  </html>
